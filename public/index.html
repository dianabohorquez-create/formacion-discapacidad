<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Formación en discapacidad</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Lexend:wght@400;500;600;700&display=swap">
<style>
/* Concepto: aula a pantalla completa. Escenario 16:9 luminoso (lo que se comparte en Teams) dentro de un panel
   de control que sigue el tema del sistema. Cada tema tiene su color dentro de la misma paleta; equipos con color + forma.
   Tipos: Lexend (titulares) + Atkinson Hyperlegible (lectura, máxima legibilidad). */
:root{
  --navy:#1B3A4B; --leaf:#84BD00; --leaf-ink:#3F6A0B; --sun:#F5B700; --mist:#EDF3E4; --paper:#FBFCF8; --ink:#14232C; --grey:#5A6A70;
  --accent:#1F8A99; --accent-ink:#1B3A4B;
  --display:"Lexend","Atkinson Hyperlegible",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Lexend",system-ui,-apple-system,"Segoe UI",sans-serif;
  --bg:#F2F5EE; --surface:#FFFFFF; --fg:#16252E; --muted:#51616A; --line:#D3DCCB; --chip:#E4ECD9; --focus:#0A6CFF;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0F181D;--surface:#17242B;--fg:#E7EEE9;--muted:#A3B2AA;--line:#2C3D45;--chip:#22343B;--focus:#7DB4FF;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F181D;--surface:#17242B;--fg:#E7EEE9;--muted:#A3B2AA;--line:#2C3D45;--chip:#22343B;--focus:#7DB4FF;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.55;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 32px}
a{color:inherit}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-999px}.skip:focus{left:16px;top:8px;background:var(--surface);padding:8px 12px;z-index:50}
code{font-size:.92em;background:var(--chip);border-radius:5px;padding:1px 5px}

/* ---------- Panel de control ---------- */
.top{max-width:1320px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-block:4px 10px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand-mark{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;background:conic-gradient(#84BD00 0 60deg,#1F8A99 0 120deg,#E69A00 0 180deg,#E0604A 0 240deg,#3D7DD8 0 300deg,#9A5FC2 0)}
.brand-mark span{width:22px;height:22px;border-radius:50%;background:var(--surface)}
.brand h1{font-family:var(--display);font-size:18px;line-height:1.2;margin:0}
.brand p{margin:0;color:var(--muted);font-size:13px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto}
.tab{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:999px;font-size:14px}
.tab[aria-selected="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.view{max-width:1320px;margin:0 auto}
.daybar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.daybtn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 14px;font-size:14px;display:flex;gap:8px;align-items:center}
.daybtn b{font-family:var(--display)}
.daybtn[aria-pressed="true"]{border-color:var(--navy);box-shadow:inset 0 0 0 2px var(--navy)}
.daybtn i{display:inline-flex;gap:3px}.daybtn i span{width:9px;height:9px;border-radius:50%}
.stage-shell{display:flex;flex-direction:column;gap:10px}
.stage-wrap{position:relative;width:100%;aspect-ratio:16/9;max-width:100%;background:#0E1A20;border-radius:14px;overflow:hidden;box-shadow:0 10px 30px rgba(10,30,20,.18)}
.stage-wrap:fullscreen{border-radius:0}
.stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0}
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.ctl{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.ctl svg{width:18px;height:18px}
.ctl[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
.counter{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px;min-width:84px;text-align:center}
.progress{flex:1 1 180px;height:10px;background:var(--chip);border-radius:99px;position:relative;overflow:hidden;min-width:100px}
.progress i{position:absolute;inset:0 auto 0 0;border-radius:99px;transition:width .3s}
.jump{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:10px;padding:8px;font-size:14px;max-width:100%;min-width:0;flex:1 1 220px}
.livechip{border-radius:99px;padding:8px 14px;font-size:14px;font-weight:700;border:1px solid #E2C36B;background:#FFF1C2;color:#5A3E00}
.livechip[data-state="on"]{background:#2E7D32;border-color:#2E7D32;color:#fff;cursor:default}
.livechip[data-state="demo"]{background:var(--chip);border-color:var(--line);color:var(--fg)}
.notes{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 18px}
.notes h3{margin:0 0 6px;font-family:var(--display);font-size:15px}
.notes p,.notes li{margin:0 0 6px}
.hint{color:var(--muted);font-size:13px}
kbd{font-family:var(--body);background:var(--chip);border-radius:5px;padding:1px 6px;font-size:12px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#14232C;color:#fff;padding:12px 18px;border-radius:12px;z-index:100;max-width:calc(100% - 32px);font-size:15px;box-shadow:0 8px 24px rgba(0,0,0,.25)}

/* ---------- Diapositivas (paleta fija) ---------- */
.sl{position:absolute;inset:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:25px;line-height:1.36;padding:46px 66px 56px;display:flex;flex-direction:column;overflow:hidden}
.sl::before{content:"";position:absolute;left:0;top:0;bottom:0;width:10px;background:var(--accent)}
.sl.full::before,.sl.dark::before{display:none}
.kick{font-family:var(--display);font-size:16px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-ink);font-weight:600;display:flex;align-items:center;gap:10px;margin-bottom:8px}
.kick .dot{width:12px;height:12px;border-radius:50%;background:var(--accent)}
.sl h2{font-family:var(--display);font-weight:700;font-size:44px;line-height:1.1;margin:0 0 16px;color:var(--navy);text-wrap:balance;letter-spacing:-.01em}
.sl h3{font-family:var(--display);font-weight:600;font-size:26px;margin:0 0 6px;color:var(--navy)}
.lead{font-size:26px;margin:0 0 16px;max-width:31em}
ul.b{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
ul.b li{padding-left:32px;position:relative}
ul.b li::before{content:"";position:absolute;left:4px;top:.45em;width:13px;height:13px;border-radius:4px;background:var(--accent)}
.foot{position:absolute;left:66px;right:66px;bottom:18px;display:flex;justify-content:space-between;font-size:14px;color:var(--grey);font-family:var(--display)}
.foot b{color:var(--accent-ink);font-weight:600}
.note{margin-top:auto;background:#FFF6D6;border-left:8px solid var(--sun);padding:12px 18px;border-radius:0 12px 12px 0;font-size:21px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:34px;align-items:start;flex:1;min-height:0}
.cols.wide{grid-template-columns:1.25fr .9fr}
.cards{display:grid;gap:14px}
.card{background:#fff;border:2px solid #DCE5D3;border-radius:18px;padding:16px 20px}
.card h3{font-size:23px}
.card p{margin:0;font-size:20px}
.card .ic{color:var(--accent-ink);display:block;width:38px;height:38px;margin-bottom:6px}
.grid{display:grid;gap:18px}
.diagram{width:100%;flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.diagram svg{width:100%;height:100%;max-height:500px}
table.t{border-collapse:separate;border-spacing:0;width:100%;background:#fff;border-radius:14px;overflow:hidden;border:2px solid #DCE5D3}
table.t th{background:var(--navy);color:#fff;text-align:left;font-family:var(--display);font-weight:600;padding:9px 13px}
table.t td{padding:8px 13px;border-top:1px solid #E3EADB;vertical-align:top}
table.t tr:nth-child(even) td{background:#F6F9F1}
table.t td:first-child{font-weight:700;color:var(--accent-ink)}

/* Portadas */
.sl.dark{background:var(--navy);color:#fff}
.sl.dark h2{color:#fff}.sl.dark .kick{color:var(--sun)}.sl.dark .lead{color:#DCE8DE}
.cover{padding:0;flex-direction:row}
.cover .cv-text{flex:1.1;padding:64px 60px;display:flex;flex-direction:column;justify-content:center;gap:14px;position:relative}
.cover .cv-text::before{content:"";position:absolute;left:0;top:0;bottom:0;width:14px;background:var(--accent)}
.cover h2{font-size:56px}
.cover .num{font-family:var(--display);font-weight:700;font-size:120px;line-height:.9;color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chips span{background:rgba(255,255,255,.12);border-radius:99px;padding:6px 16px;font-family:var(--display);font-size:18px}
.cover .cv-photo{flex:1;position:relative}
.sl.section{background:var(--mist);justify-content:center}
.section .bignum{font-family:var(--display);font-weight:700;font-size:28px;color:var(--accent-ink);display:flex;gap:12px;align-items:center}
.section .bignum i{width:56px;height:8px;border-radius:9px;background:var(--accent)}
.section h2{font-size:62px;margin-top:12px}
.section .time{font-family:var(--display);font-size:22px;color:var(--accent-ink)}
.seeds{position:absolute;right:-40px;top:-40px;width:460px;height:460px;opacity:.45;pointer-events:none}
.seeds line{stroke:var(--accent)}.seeds circle{fill:var(--accent)}
.seeds g{transform-origin:200px 200px;animation:spin 60s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Foto */
.photo{position:relative;width:100%;height:100%;min-height:220px;border-radius:18px;overflow:hidden;background:linear-gradient(135deg,var(--accent),#1B3A4B);display:flex;align-items:center;justify-content:center}
.cover .photo{border-radius:0;min-height:100%}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:kb 18s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.06)}}
.photo .ph-empty{color:rgba(255,255,255,.55)}
.photo.filled .ph-empty{display:none}
.photo .ph-credit{position:absolute;left:10px;bottom:8px;z-index:2;font-size:12px;color:#fff;background:rgba(0,0,0,.55);border-radius:6px;padding:2px 8px}
.photo .ph-credit:empty{display:none}

/* Día, agenda, accesibilidad */
.dayhero{display:grid;grid-template-columns:auto 1fr;gap:46px;align-items:center;flex:1}
.dayhero .dn{font-family:var(--display);font-weight:700;font-size:250px;line-height:.8;color:var(--sun)}
.dayhero h2{font-size:80px;margin:0}
.dayhero .lead{font-size:30px}
.agenda{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px;position:relative}
.agenda::before{content:"";position:absolute;left:97px;top:10px;bottom:10px;width:3px;background:#DCE5D3}
.agenda li{display:grid;grid-template-columns:80px 36px 1fr;gap:0;align-items:center;font-size:23px;opacity:0;transform:translateX(-14px);animation:in .5s forwards}
.agenda time{font-family:var(--display);font-weight:600;color:var(--grey);font-variant-numeric:tabular-nums;font-size:20px}
.agenda .dt{width:20px;height:20px;border-radius:50%;border:4px solid #fff;box-shadow:0 0 0 2px currentColor;justify-self:center;background:currentColor;position:relative;z-index:1}
.agenda .tx{background:#fff;border:2px solid #DCE5D3;border-radius:14px;padding:7px 16px;display:flex;align-items:center;gap:12px}
.agenda .tx em{font-style:normal;font-family:var(--display);font-size:14px;font-weight:700;color:#fff;border-radius:99px;padding:2px 10px;flex:none}
.agenda li.pause .tx{background:#F2F5EE;border-style:dashed;color:var(--grey)}
@keyframes in{to{opacity:1;transform:none}}
.acc{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.acc .card{padding:14px 16px}
.acc .card h3{font-size:20px;display:flex;gap:8px;align-items:center}
.acc .card h3 svg{width:28px;height:28px;color:var(--accent-ink);flex:none}
.acc .card p{font-size:16.5px;line-height:1.3}
.acc .how{display:block;margin-top:6px;font-size:14.5px;color:var(--grey);font-family:var(--display)}

/* Hilo conductor */
.duo{display:grid;grid-template-columns:1fr 1fr;gap:30px;flex:1}
.person{background:#fff;border:2px solid #DCE5D3;border-radius:22px;padding:26px 26px;display:grid;grid-template-columns:150px 1fr;gap:22px;align-items:center}
.person svg.av{width:150px;height:150px}
.person h3{font-size:34px;margin:0}
.person .age{font-family:var(--display);color:var(--grey);font-size:18px;margin-bottom:8px}
.person p{margin:0;font-size:23px;line-height:1.4}
.story{display:grid;grid-template-columns:230px 1fr;gap:34px;align-items:center;flex:1}
.story .avs{display:flex;flex-direction:column;align-items:center;gap:6px}
.story .avs svg{width:200px;height:200px}
.story .avs b{font-family:var(--display);font-size:22px;color:var(--navy)}
.story .bubble{background:#fff;border:3px solid var(--accent);border-radius:26px;padding:24px 30px;font-size:28px;line-height:1.38;position:relative}
.story .bubble::before{content:"";position:absolute;left:-22px;top:60px;border:11px solid transparent;border-right:12px solid var(--accent)}
.story .ask{margin-top:16px;font-family:var(--display);font-weight:600;color:var(--accent-ink);font-size:26px}
.badge-story{display:inline-flex;align-items:center;gap:8px;font-family:var(--display);font-size:15px;font-weight:600;color:var(--accent-ink);background:var(--mist);border-radius:99px;padding:3px 12px 3px 4px}
.badge-story svg{width:28px;height:28px}

/* Necesidades */
.need{display:grid;grid-template-columns:1fr 1fr;gap:22px;flex:1;min-height:0}
.need .bar-col{display:flex;flex-direction:column;gap:14px}
.need .tagline{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px}
.need .barr{background:#FBE9E7;border-radius:16px;padding:14px 18px}
.need .barr .tagline{color:#8C1D18}
.need .sup{background:#EAF5D6;border-radius:16px;padding:14px 18px}
.need .sup .tagline{color:var(--leaf-ink)}
.need ul{margin:0;padding-left:22px;font-size:20px}
.need p{margin:0;font-size:20px}
.need .ej{background:#fff;border:2px solid #DCE5D3;border-radius:16px;padding:14px 18px}
.need .quote{font-family:var(--display);font-size:22px;color:var(--accent-ink);font-weight:600;border-left:6px solid var(--accent);padding-left:14px}

/* Vídeo */
.vid{flex:1;border-radius:20px;background:#0F2530;display:grid;place-items:center;position:relative;overflow:hidden;min-height:0}
.vid iframe,.vid video{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
.vid .vph{display:flex;flex-direction:column;align-items:center;gap:14px;color:#DCE8DE;text-align:center;padding:30px}
.vid .play{width:130px;height:130px;border-radius:50%;background:var(--accent);display:grid;place-items:center;box-shadow:0 0 0 0 rgba(255,255,255,.4);animation:pulse2 2.4s infinite}
.vid .play svg{width:60px;height:60px}
@keyframes pulse2{0%{box-shadow:0 0 0 0 rgba(255,255,255,.35)}70%{box-shadow:0 0 0 30px rgba(255,255,255,0)}100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}}
.vid .vtag{font-family:var(--display);font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:15px;color:var(--sun)}
.vid .vt{font-family:var(--display);font-size:30px;font-weight:600;color:#fff;max-width:24em}
.links a{color:var(--sun);font-family:var(--display);font-size:20px;display:block;margin-top:6px}
.vsum{display:grid;grid-template-columns:1fr 1fr;gap:30px;flex:1;min-height:0;align-items:center}
.vsum.nodiag{grid-template-columns:1fr}
.vsum ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px;counter-reset:v}
.vsum li{counter-increment:v;display:grid;grid-template-columns:40px 1fr;gap:12px;font-size:21px;line-height:1.32;opacity:0;animation:in .45s forwards}
.vsum li::before{content:counter(v);width:38px;height:38px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:18px}
.vsum.cardsum ol{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
.vsum.cardsum li{background:#fff;border:2px solid #DCE5D3;border-radius:16px;padding:14px;grid-template-columns:1fr}

/* Dinámicas */
.act-top{display:flex;align-items:center;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.chan{display:inline-flex;align-items:center;gap:8px;font-family:var(--display);font-weight:600;font-size:16px;padding:6px 14px 6px 10px;border-radius:99px;color:#fff;background:var(--accent-ink)}
.chan svg{width:20px;height:20px}
.chan.quiz{background:var(--navy)}
.chan.score{background:#7A5200}
.act-min{margin-left:auto;font-family:var(--display);font-size:16px;color:var(--grey)}
.live-n{font-family:var(--display);font-weight:700;font-size:16px;color:#fff;background:var(--navy);border-radius:99px;padding:5px 14px;font-variant-numeric:tabular-nums}
.act-body{display:grid;grid-template-columns:1fr 210px;gap:28px;flex:1;min-height:0}
.act-main{display:flex;flex-direction:column;min-height:0;min-width:0}
.act h2{font-size:34px;margin-bottom:10px}
.situ{font-size:20px;background:var(--mist);border-radius:14px;padding:10px 16px;margin:0 0 12px;line-height:1.32}
.vizbox{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;overflow:hidden}
.explain{display:none;margin-top:10px;background:#FFF6D6;border-left:8px solid var(--sun);border-radius:0 14px 14px 0;padding:10px 16px;font-size:20px;line-height:1.35}
.revealed .explain{display:block}
.act-bar{display:flex;gap:10px;align-items:center;margin-top:10px;flex-wrap:wrap}
.sbtn{border:2px solid var(--navy);background:#fff;color:var(--navy);border-radius:12px;padding:7px 14px;font-family:var(--display);font-weight:600;font-size:17px;display:inline-flex;gap:8px;align-items:center}
.sbtn.primary{background:var(--navy);color:#fff}
.sbtn.go{background:var(--accent-ink);border-color:var(--accent-ink);color:#fff}
.sbtn svg{width:19px;height:19px}
.timer{font-family:var(--display);font-variant-numeric:tabular-nums;font-size:24px;font-weight:700;color:var(--navy);min-width:80px}
.timer.low{color:#B3261E}
.qrbox{background:#fff;border:2px solid #DCE5D3;border-radius:18px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;align-self:start}
.qrbox .qr{width:180px;height:180px;display:grid;place-items:center;overflow:hidden;font-size:12px;word-break:break-all}
.qrbox .qr img,.qrbox .qr canvas{width:180px!important;height:180px!important}
.qrbox small{font-size:13px;color:var(--grey);line-height:1.3}
.qrbox .pc{font-family:var(--display);font-size:12.5px;color:var(--navy);word-break:break-all;background:var(--mist);border-radius:8px;padding:4px 6px}

/* Opciones / barras */
.opts{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.opts.two{grid-template-columns:1fr 1fr}
.opt{position:relative;overflow:hidden;display:flex;gap:12px;align-items:center;background:#F7F9F4;border:2px solid #DCE5D3;border-radius:14px;padding:9px 14px;font-size:22px;line-height:1.25;transition:opacity .3s,border-color .3s}
.opt>*{position:relative;z-index:1}
.opt .L{flex:none;width:36px;height:36px;border-radius:10px;background:var(--navy);color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:18px}
.opt .bar{position:absolute;left:0;top:0;bottom:0;width:0;background:color-mix(in srgb,var(--accent) 30%,transparent);z-index:0;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.opt .pct{margin-left:auto;flex:none;font-family:var(--display);font-weight:700;font-size:20px;color:var(--navy);font-variant-numeric:tabular-nums}
.opt .okm{display:none;flex:none;font-family:var(--display);font-size:15px;font-weight:700;color:var(--leaf-ink)}
.revealed .opt{opacity:.5}
.revealed .opt.ok{opacity:1;border-color:var(--leaf-ink);background:#EAF5D6}
.revealed .opt.ok .L{background:var(--leaf-ink)}
.revealed .opt.ok .okm{display:inline}
.noresults .bar,.noresults .pct,.noresults .viz-live,.noresults .live-n{visibility:hidden}

/* Quiz */
.qopts{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:0;padding:0;list-style:none}
.qopts .opt{min-height:84px;font-size:24px;color:#fff;border:none}
.qopts .opt .L{background:rgba(255,255,255,.22);font-size:22px}
.qopts .opt:nth-child(1){background:#1B3A4B}.qopts .opt:nth-child(2){background:#0E5F6B}.qopts .opt:nth-child(3){background:#7A5200}.qopts .opt:nth-child(4){background:#643A86}
.qopts .opt .bar{background:rgba(255,255,255,.18)}
.qopts .opt .pct{color:#fff}
.revealed .qopts .opt.ok{background:#3F6A0B;box-shadow:0 0 0 4px #84BD00}
.revealed .qopts .opt.ok .okm{color:#fff}
.ring{width:92px;height:92px;position:relative;flex:none}
.ring svg{width:92px;height:92px;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:28px;color:var(--navy);font-variant-numeric:tabular-nums}

/* Tira y afloja */
.tug{flex:1;display:flex;flex-direction:column;justify-content:center;gap:10px;min-height:250px}
.tug-row{display:grid;grid-template-columns:150px 1fr 150px;align-items:center;gap:10px}
.tug-side{text-align:center;font-family:var(--display)}
.tug-side .lab{font-size:24px;font-weight:700;color:var(--navy)}
.tug-side .n{font-size:44px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.tug-side.l .n{color:#3F6A0B}.tug-side.r .n{color:#A3361F}
.tug-field{position:relative;height:190px;border-radius:20px;background:linear-gradient(90deg,#EAF5D6 0 50%,#FBE9E7 50% 100%);overflow:hidden}
.tug-field .mid{position:absolute;left:50%;top:10px;bottom:10px;width:4px;margin-left:-2px;background:repeating-linear-gradient(#14232C 0 10px,transparent 10px 18px);opacity:.45}
.tug-mover{position:absolute;left:-40%;right:-40%;top:0;bottom:0;transition:transform 1.1s cubic-bezier(.3,1.4,.5,1)}
.tug-mover svg{width:100%;height:100%}
.tug.pull .tug-mover svg{animation:jig .35s ease-in-out 3}
@keyframes jig{50%{transform:translateX(-6px)}}
.tug-extra{text-align:center;font-family:var(--display);font-size:20px;color:var(--grey)}
.tug-win{font-family:var(--display);font-size:22px;text-align:center;color:var(--navy);min-height:30px}

/* Balanza */
.balance{flex:1;display:flex;align-items:center;justify-content:center;min-height:260px}
.balance svg{width:100%;height:100%;max-height:360px;overflow:visible}
.balance .beam{transition:transform 1.2s cubic-bezier(.3,1.5,.5,1);transform-origin:400px 92px}
.balance .pan{transition:transform 1.2s cubic-bezier(.3,1.5,.5,1)}
.bal-labels{display:grid;grid-template-columns:1fr 1fr;gap:30px;font-size:18px;line-height:1.3;text-align:center;margin-top:4px}
.bal-labels b{font-family:var(--display);color:var(--navy)}

/* Nube y top 5 */
.cloudwrap{display:grid;grid-template-columns:1fr 300px;gap:20px;flex:1;min-height:0}
.cloud{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;align-content:center;gap:4px 20px;min-height:220px;overflow:hidden;padding:8px;font-family:var(--display);font-weight:700;line-height:1.05}
.cloud span{animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}
@keyframes pop{from{transform:scale(.3);opacity:0}}
.top5{background:#fff;border:2px solid #DCE5D3;border-radius:16px;padding:12px 14px;align-self:start}
.top5 h4{margin:0 0 8px;font-family:var(--display);font-size:16px;color:var(--accent-ink);text-transform:uppercase;letter-spacing:.08em}
.top5 ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.top5 li{display:grid;grid-template-columns:30px 1fr auto;gap:8px;align-items:center;font-size:18px;position:relative}
.top5 li .r{font-family:var(--display);font-weight:700;color:#fff;background:var(--accent-ink);border-radius:8px;text-align:center;font-size:15px;padding:2px 0}
.top5 li:nth-child(1) .r{background:#B88A00}.top5 li:nth-child(2) .r{background:#7D8A90}.top5 li:nth-child(3) .r{background:#A0623A}
.top5 li .c{font-family:var(--display);font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:20px;flex:1;min-height:0}
.cmp>div{background:#fff;border:2px solid #DCE5D3;border-radius:18px;padding:10px;display:flex;flex-direction:column}
.cmp h4{margin:0;font-family:var(--display);color:var(--accent-ink);text-align:center}
.cmp .cloud{min-height:0;flex:1;font-size:.8em}

/* Cascada y muro */
.cascade-wait{flex:1;display:grid;place-items:center;text-align:center}
.pile{position:relative;width:260px;height:150px;margin:0 auto 10px}
.pile i{position:absolute;inset:0;background:#FFF6D6;border:2px solid #E8D48A;border-radius:14px}
.pile i:nth-child(1){transform:rotate(-6deg) translate(-10px,6px)}.pile i:nth-child(2){transform:rotate(4deg) translate(8px,2px)}.pile i:nth-child(3){transform:rotate(-1deg)}
.pile b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:60px;color:var(--navy);z-index:2}
.cascade-wait p{margin:0;font-family:var(--display);font-size:22px;color:var(--grey)}
.wall{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;align-content:start;overflow:hidden;flex:1;min-height:0}
.wcard{position:relative;background:#FFF6D6;border-radius:12px;padding:10px 30px 10px 12px;font-size:17px;line-height:1.3;overflow-wrap:anywhere;box-shadow:0 2px 0 rgba(0,0,0,.06)}
.wcard:nth-child(3n+2){background:#EAF5D6}.wcard:nth-child(3n){background:#E3EEF5}
.wcard.drop{animation:drop .7s cubic-bezier(.3,1.3,.5,1) both}
@keyframes drop{from{transform:translateY(-420px) rotate(-8deg);opacity:0}}
.wdel{position:absolute;right:4px;top:4px;border:none;background:transparent;font-size:20px;color:#8A5A00;line-height:1;padding:2px 6px;border-radius:6px}
.tcard{display:inline-flex;align-items:center;gap:4px;font-family:var(--display);font-size:12px;font-weight:700;margin-right:4px}

/* Ítems */
.items{display:flex;flex-direction:column;gap:9px;flex:1;min-height:0;overflow:hidden}
.irow{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:center;background:#fff;border:2px solid #DCE5D3;border-radius:14px;padding:7px 12px}
.irow .it{font-size:19px;line-height:1.25}
.irow .it b{font-family:var(--display)}
.mtug{position:relative;height:30px;border-radius:99px;background:#F2F5EE;overflow:hidden}
.mtug .gl,.mtug .gr{position:absolute;top:0;bottom:0;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.mtug .gl{right:50%;background:#84BD00}.mtug .gr{left:50%;background:#E0604A}
.mtug .c{position:absolute;left:50%;top:-3px;bottom:-3px;width:3px;background:#14232C;margin-left:-1px}
.mtug .vl,.mtug .vr{position:absolute;top:3px;font-family:var(--display);font-weight:700;font-size:15px;color:#14232C}
.mtug .vl{left:10px}.mtug .vr{right:10px}
.stack{display:flex;height:30px;border-radius:99px;overflow:hidden;background:#F2F5EE}
.stack span{display:grid;place-items:center;font-family:var(--display);font-size:14px;font-weight:700;color:#fff;transition:flex-grow .9s cubic-bezier(.2,.8,.2,1);flex-basis:0;min-width:0;overflow:hidden;white-space:nowrap}
.itop{display:flex;align-items:center;gap:10px;font-family:var(--display);font-size:17px}
.itop .chip{background:var(--accent-ink);color:#fff;border-radius:99px;padding:3px 12px;font-weight:700;white-space:nowrap}
.itop .sub{color:var(--grey);font-size:14px}
.irow .rec{display:none;font-family:var(--display);font-size:14px;color:var(--leaf-ink);font-weight:700}
.revealed .irow .rec{display:block}
.iscore{font-family:var(--display);font-weight:700;color:var(--navy);font-size:20px}

/* Gauge */
.gauge{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.gauge .big{font-family:var(--display);font-size:64px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}

/* Podio y carrera */
.podium{flex:1;display:grid;grid-template-columns:1fr 1fr 1fr;align-items:end;gap:18px;padding:0 40px;min-height:0;position:relative}
.pcol{display:flex;flex-direction:column;align-items:center;gap:8px}
.pcol .who{font-family:var(--display);font-weight:700;font-size:30px;display:flex;align-items:center;gap:10px;opacity:0;transform:translateY(20px);transition:all .6s}
.pcol .pts{font-family:var(--display);font-size:22px;color:var(--grey);opacity:0;transition:opacity .6s}
.pcol .blk{width:100%;border-radius:16px 16px 0 0;display:grid;place-items:start center;padding-top:18px;font-family:var(--display);font-weight:700;font-size:70px;color:#fff;height:0;transition:height 1.2s cubic-bezier(.2,.9,.3,1.2);overflow:hidden}
.pcol.p1 .blk{background:linear-gradient(#D9A400,#B88A00)}.pcol.p2 .blk{background:linear-gradient(#9AA6AB,#7D8A90)}.pcol.p3 .blk{background:linear-gradient(#C4825A,#A0623A)}
.revealed .pcol .who,.revealed .pcol .pts{opacity:1;transform:none}
.pcol .sh{font-size:34px}
.podium-foot{display:flex;justify-content:center;gap:24px;margin-top:10px;font-family:var(--display);font-size:18px;color:var(--grey);flex-wrap:wrap}
.race{display:flex;flex-direction:column;gap:6px}
.lane{display:grid;grid-template-columns:120px 1fr 70px;gap:10px;align-items:center;font-family:var(--display);font-size:16px}
.lane .tr{height:22px;background:#EEF2EA;border-radius:99px;position:relative;overflow:hidden}
.lane .fill{position:absolute;inset:0 auto 0 0;border-radius:99px;transition:width 1.2s cubic-bezier(.2,.8,.2,1);display:flex;justify-content:flex-end;align-items:center;padding-right:6px;color:#fff;font-size:13px}
.lane b{text-align:right;font-variant-numeric:tabular-nums}
.minirace{display:none;margin-top:8px;background:#fff;border:2px solid #DCE5D3;border-radius:14px;padding:8px 12px}
.revealed .minirace{display:block}
.minirace h4{margin:0 0 6px;font-family:var(--display);font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-ink)}
canvas.confetti{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:20}

/* Q&A */
.qa{display:grid;grid-template-columns:1fr 210px;gap:28px;flex:1;min-height:0}
.qalist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.qalist li{display:grid;grid-template-columns:46px 1fr auto;gap:14px;align-items:center;background:#fff;border:2px solid #DCE5D3;border-radius:16px;padding:10px 14px;font-size:22px;line-height:1.28;animation:in .4s both;cursor:pointer}
.qalist li .r{width:44px;height:44px;border-radius:12px;background:var(--accent-ink);color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:22px}
.qalist li .n{font-family:var(--display);font-weight:700;color:var(--navy);font-size:18px;white-space:nowrap}
.qalist li.done{opacity:.45}.qalist li.done .q{text-decoration:line-through}
.qalist .sim{display:block;font-size:14px;color:var(--grey);font-family:var(--display)}
.wait{font-size:20px;color:var(--grey);border:2px dashed #DCE5D3;border-radius:14px;padding:18px;text-align:center}

/* Escena */
.scene{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.scene .ctx{font-size:19px;color:var(--grey)}
.scene .line{display:flex;gap:10px;align-items:flex-start;opacity:0;animation:in .5s forwards}
.scene .who{flex:none;font-family:var(--display);font-weight:700;font-size:15px;background:var(--navy);color:#fff;border-radius:99px;padding:3px 12px;margin-top:4px}
.scene .say{background:#fff;border:2px solid #DCE5D3;border-radius:16px;padding:6px 14px;font-size:20px}
.notice{position:absolute;inset:0;background:rgba(20,35,44,.75);display:grid;place-items:center;z-index:10}
.notice .paper{width:860px;background:#F4F1EA;border-radius:6px;padding:26px 34px;font-size:15.5px;line-height:1.45;color:#3A3A36;font-family:Georgia,"Times New Roman",serif;box-shadow:0 20px 50px rgba(0,0,0,.4);transform:rotate(-.6deg)}
.notice .paper h4{margin:0 0 10px;text-align:center;letter-spacing:.06em;font-family:Georgia,serif}
.notice .ncount{position:absolute;right:30px;top:24px;background:#fff;border-radius:99px;font-family:var(--display);font-weight:700;font-size:30px;padding:4px 18px;color:var(--navy)}

/* Lectura fácil, pausa, ideas, fin */
.sl.lf{background:#FFFDF5}
.lf-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:18px}
.lf-list li{display:flex;gap:22px;align-items:center;font-size:31px;line-height:1.3}
.lf-ico{flex:none;width:74px;height:74px;border-radius:18px;background:#fff;border:3px solid var(--navy);display:grid;place-items:center}
.lf-ico svg{width:48px;height:48px}
.lf-badge{font-family:var(--display);font-size:14px;color:#7A5200;background:#FFF1C2;border-radius:8px;padding:4px 10px}
.lf-badge.ok{color:#2E5A00;background:#E6F4CC}
.sl.pause{background:var(--navy);color:#fff;align-items:center;justify-content:center;text-align:center}
.pause h2{color:#fff;font-size:56px}
.bigring{width:330px;height:330px;position:relative;margin:10px auto}
.bigring svg{width:100%;height:100%;transform:rotate(-90deg)}
.bigring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:86px;font-variant-numeric:tabular-nums}
.ideas{display:grid;gap:16px}
.ideas .card{animation:in .5s both}
.ideas .card .tag{display:inline-block;font-family:var(--display);font-size:15px;font-weight:600;padding:3px 12px;border-radius:99px;background:var(--mist);color:var(--accent-ink)}
.ten{grid-template-columns:repeat(5,1fr)}
.ten .card{padding:12px 14px}.ten .card h3{font-size:30px;color:var(--accent)}.ten .card p{font-size:17px}
.muro{display:grid;grid-template-columns:repeat(5,1fr);grid-auto-rows:1fr;gap:12px;flex:1;min-height:0}
.mcard{border-radius:16px;padding:12px 14px;color:#fff;display:flex;flex-direction:column;justify-content:space-between;animation:pop .6s cubic-bezier(.3,1.6,.5,1) both;position:relative}
.mcard .rk{font-family:var(--display);font-size:15px;opacity:.85}
.mcard .tx{font-family:var(--display);font-weight:600;font-size:20px;line-height:1.2}
.mcard .ct{font-family:var(--display);font-size:14px;opacity:.9}
.mcard.top{grid-column:span 2;grid-row:span 2}.mcard.top .tx{font-size:34px}

/* ---------- Guía ---------- */
.guide{display:grid;grid-template-columns:230px 1fr;gap:26px;align-items:start}
.toc{position:sticky;top:12px;display:flex;flex-direction:column;gap:4px;font-size:14px}
.toc a{text-decoration:none;color:var(--muted);padding:6px 10px;border-radius:8px}
.toc a:hover{background:var(--chip);color:var(--fg)}
.gsec{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 26px;margin-bottom:18px;min-width:0}
.gsec h2{font-family:var(--display);font-size:22px;margin:0 0 6px}
.gsec h3{font-family:var(--display);font-size:17px;margin:18px 0 6px}
.gsec p,.gsec li{max-width:78ch}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:14px 0}
.kpi{background:var(--chip);border-radius:12px;padding:12px 14px}
.kpi b{display:block;font-family:var(--display);font-size:24px;font-variant-numeric:tabular-nums}
.kpi span{color:var(--muted);font-size:13px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table.ag{border-collapse:collapse;width:100%;font-size:14px;min-width:620px}
table.ag th{text-align:left;background:var(--chip);padding:8px 10px;font-family:var(--display);font-weight:600}
table.ag td{padding:7px 10px;border-top:1px solid var(--line);vertical-align:top}
table.ag td.n{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
table.ag tr.blk td{background:var(--chip);font-family:var(--display);font-weight:600}
.pill{display:inline-block;border-radius:99px;padding:1px 9px;font-size:12px;font-weight:700;white-space:nowrap;color:#fff;background:#1B3A4B}
.dyn{border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin:10px 0}
.dyn h4{margin:0 0 4px;font-family:var(--display);font-size:16px}
.dyn .meta{color:var(--muted);font-size:13px;margin-bottom:6px}
.field{display:flex;flex-direction:column;gap:4px;margin:10px 0;max-width:560px}
.field label{font-weight:700;font-size:14px}
.field input{font:inherit;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:10px;padding:9px 12px}
.btn{border:1px solid var(--navy);background:var(--navy);color:#fff;border-radius:10px;padding:8px 14px;font-size:14px}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--line)}
.btn:disabled{opacity:.5}
.warn{background:#FFF6D6;color:#3A2A00;border-left:6px solid var(--sun);padding:10px 14px;border-radius:0 10px 10px 0}
@media (max-width:820px){.guide{grid-template-columns:1fr}.toc{position:static;flex-direction:row;flex-wrap:wrap}}

/* ---------- Participantes (móvil y ordenador) ---------- */
body.pmode{background:#EEF3E8;color:#14232C;padding-block:0;font-size:18px}
body.pmode .top,body.pmode #main,body.pmode .skip{display:none!important}
body.pmode.big{font-size:22px}
body.pmode.hc{background:#000;color:#fff}
#participant{max-width:620px;margin:0 auto;padding-block:12px calc(120px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.ptop{display:flex;justify-content:space-between;align-items:center;gap:10px;font-family:var(--display);font-size:15px;font-weight:600;color:#1B3A4B}
.hc .ptop{color:#fff}
.pteam{display:inline-flex;align-items:center;gap:6px;border:2px solid currentColor;border-radius:99px;padding:4px 12px;background:#fff;font-weight:700}
.hc .pteam{background:#000}
.ptools{display:flex;gap:6px;align-items:center}
.ptools button{border:2px solid #C9D6BD;background:#fff;border-radius:99px;padding:4px 10px;font-weight:700;font-size:15px;color:#1B3A4B}
.hc .ptools button{background:#000;color:#fff;border-color:#fff}
.plive{display:inline-flex;align-items:center;gap:6px;color:#2E7D32;font-size:13px}
.plive i{width:8px;height:8px;border-radius:50%;background:#2E7D32;animation:pl 1.6s infinite}
@keyframes pl{50%{opacity:.3}}
.pcard{background:#fff;border-radius:22px;padding:22px 20px;border-top:6px solid var(--accent);box-shadow:0 8px 24px rgba(20,35,44,.08);display:flex;flex-direction:column;gap:12px}
.hc .pcard{background:#000;border:2px solid #fff;box-shadow:none}
.pcard .eyebrow{font-family:var(--display);font-size:.72em;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--accent-ink)}
.hc .pcard .eyebrow{color:#FFE066}
.pcard h1{font-family:var(--display);font-size:1.35em;line-height:1.2;margin:0;color:#1B3A4B}
.hc .pcard h1{color:#fff}
.pcard p{margin:0;line-height:1.5}
.psitu{background:#EDF3E4;border-radius:12px;padding:10px 12px;font-size:.92em}
.hc .psitu{background:#111;border:1px solid #888}
.phint{color:#4A5A61;font-size:.88em}
.hc .phint{color:#ddd}
.popts{display:flex;flex-direction:column;gap:10px}
.popt{display:flex;align-items:center;gap:12px;text-align:left;width:100%;min-height:58px;border:2px solid #C9D6BD;background:#F7F9F4;color:#14232C;border-radius:16px;padding:10px 14px;font-size:1em;line-height:1.3}
.hc .popt{background:#000;color:#fff;border-color:#fff}

/* ---------- Datos en directo y demostración ---------- */
const ANS = {}, DEMO = {};
let OPEN_AT = {}, STORED = {};
function answersOf(sid) {
  const out = [];
  [ANS[sid], DEMO[sid]].forEach(m => m && m.forEach((a, id) => out.push({ id, ...a })));
  return out;
}
const teamOf = a => (a.k ?? 0) % 10;
const devCount = arr => new Set(arr.map(a => a.dev)).size;

/* agrupar textos parecidos (para Top 5 y preguntas) */
const STOP = new Set("a al algo como con de del el ella en es esa ese eso esta este esto estos fue ha hay la las le les lo los más mas me mi muy no nos o para pero por porque puede pueden que qué se ser si sí sin sobre su sus también te tener tiene tu un una uno unos y ya yo cuál cual cuando cuándo dónde donde cómo quien quién hacer hace son está están estar".split(" "));
const norm = t => String(t).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9ñ ]+/g, " ").replace(/\s+/g, " ").trim();
const stem = w => w.length > 5 ? w.replace(/(aciones|acion|mente|idades|idad|ciones|cion|es|s)$/, "") : w.replace(/s$/, "");
const toks = t => new Set(norm(t).split(" ").filter(w => w.length > 2 && !STOP.has(w)).map(stem));
function cluster(texts) {
  const groups = [];
  texts.forEach(t => {
    const tk = toks(t); if (!tk.size) return;
    let best = null, bs = 0;
    groups.forEach(g => { let inter = 0; tk.forEach(x => g.tk.has(x) && inter++); const sim = inter / Math.min(tk.size, g.tk.size); const j = inter / (tk.size + g.tk.size - inter); const sc = Math.max(j * 1.6, sim >= .75 && inter >= 2 ? .8 : 0); if (sc > bs) { bs = sc; best = g; } });
    if (best && bs >= .5) { best.items.push(t); tk.forEach(x => best.freq[x] = (best.freq[x] || 0) + 1); }
    else { const freq = {}; tk.forEach(x => freq[x] = 1); groups.push({ tk, items: [t], freq }); }
  });
  groups.forEach(g => { g.n = g.items.length; g.rep = g.items.slice().sort((a, b) => a.length - b.length)[Math.floor((g.items.length - 1) / 2)]; });
  return groups.sort((a, b) => b.n - a.n);
}

/* puntuación por equipos */
function slidePoints(s) {
  const arr = answersOf(s.sid), first = {};
  arr.forEach(a => { if (!first[a.dev] || a.t < first[a.dev].t) first[a.dev] = a; });
  const list = Object.values(first); if (!list.length) return null;
  const open = OPEN_AT[s.sid] ?? Math.min(...list.map(a => a.t)), win = (s.secs || 25) * 1000;
  const sum = [0, 0, 0, 0], n = [0, 0, 0, 0];
  list.forEach(a => { const tm = teamOf(a); if (tm > 3) return; n[tm]++; if (Number.isInteger(a.v) && isOk(s, a.v)) sum[tm] += 100 + Math.round(50 * clamp(1 - (a.t - open) / win, 0, 1)); });
  return sum.map((x, k) => n[k] ? x / n[k] : 0);
}
function liveTotals(filter) {
  const tot = [0, 0, 0, 0];
  S_.filter(s => s.score && s.day === curDay() && filter(s)).forEach(s => { const p = slidePoints(s); if (p) p.forEach((x, k) => tot[k] += x); });
  return tot;
}
function scopeTotals(s) {
  let tot;
  if (s.scope === "theme") { tot = liveTotals(x => x.th === s.th); Object.entries(STORED).forEach(([k, v]) => { const m = k.match(/^d(\d)t(\d)$/); if (v && m && +m[1] !== s.day && +m[2] === s.th) v.forEach((x, j) => tot[j] += x); }); }
  else if (s.scope === "day") tot = liveTotals(() => true);
  else if (s.scope === "since") { let a = s.i; while (a > 0 && S_[a].t !== "section") a--; tot = liveTotals(x => x.i > a && x.i < s.i); }
  else { tot = liveTotals(() => true); Object.entries(STORED).forEach(([k, v]) => { const m = k.match(/^d(\d)t\d$/); if (v && m && +m[1] !== s.day) v.forEach((x, j) => tot[j] += x); }); }
  return tot.map((p, team) => ({ team, pts: Math.round(p) })).sort((a, b) => b.pts - a.pts);
}
function dayThemePartials(day) {
  const out = {};
  [...new Set(S_.filter(s => s.score && s.day === day).map(s => s.th))].forEach(th => { const t = liveTotals(x => x.th === th); out["d" + day + "t" + th] = t.map(Math.round); });
  return out;
}

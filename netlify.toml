# Configuración de Netlify para la formación en discapacidad
[build]
  publish = "public"
  command = "echo 'Sin compilación: se publica la carpeta public'"

# El PIN solo lo usa la función del servidor; nunca se escribe en la web.
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "PRESENTER_PIN"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
